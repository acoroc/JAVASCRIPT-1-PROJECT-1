<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Interactive Example</title>
</head>
<body>
    <h1>Interactive Example</h1>
	<h3>Section 1 Lessons</h3>
    <p>Javascript Final Project 1</p>
    
    <!--BUTTONS-->
   <button id="menuButton">Toggle Menu</button><br>
   
    
    
    
    
   <p>Counter:<span id="counter">0</span></p>
    
   <!--Toggle Menu-->
    <div id="menu" style="display: none;">
    <ul >
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#services">Services</a></li>
        <li><a href="#contact">Contact</a></li>
    </ul>
    <button id="alertButton">Show Alert</button> 
    <button id="incrementButton" >Increment Counter</button>    
    <button id="decrementButton" >Decrement Counter</button>
    <button id="resetButton" >Reset</button>
     <br><br>
    </div>
    
    
    
    <!--REGEX-->
    
     <!--Form for name input-->
    <label for ="username">Enter your name:</label>
    <input type="text" id="username" placeholder="Enter your name">
    <button id="greetButton">Greet Me</button>
    
    <!--section where the greeting appear-->
    <p id="greetingMessage"></p>

    
    
    
    <!--Button to add new paragraph-->
    <button id="AddParagraphButton">Add Paragraph</button>
    
    <!--Section where the new paragraph will be added-->
    <br>
    <br>
    <div id="paragraphContainer"></div>

    
    
    
    <!--link to an external javascript file-->
    <script src="js/script.js"></script>
</body>
</html>
